# SystemaOps production stack
#
# Public:
#   Browser
#      |
#      v
#   proxy:80
#      |
#      +---- /api/* ----> backend:5000
#      |
#      +---- /* --------> frontend:3000
#
# Internal:
#   backend:5000
#      |
#      v
#   mongodb:27017
#
# MongoDB is INTERNAL ONLY.
# It is NOT exposed to the host/internet.

services:

  mongodb:
    image: mongo:7
    restart: unless-stopped

    volumes:
      - mongodb_data:/data/db

    expose:
      - "27017"

    # IMPORTANT:
    # Do NOT add:
    # ports:
    #   - "27017:27017"
    #
    # This keeps MongoDB inaccessible from outside Docker.

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  backend:
    build:
      context: ./Server

    expose:
      - "5000"

    environment:
      MONGO_URI: mongodb://mongodb:27017/systemaops
      PORT: "5000"
      TRUST_PROXY: "1"

    env_file:
      - .env

    depends_on:
      mongodb:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:5000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s


  frontend:
    build:
      context: ./systemaops-webpage

    expose:
      - "3000"

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s


  proxy:
    build:
      context: ./proxy

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1/"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s


volumes:
  mongodb_data: