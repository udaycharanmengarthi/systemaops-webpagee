# SystemaOps production stack — host-NGINX deployment.
#
# Production (host NGINX owns :80/:443 — NEVER bind :80 from Compose):
#   Internet
#      |
#      v
#   host NGINX :80/:443
#      |
#      +---- /         ----> existing public website (127.0.0.1:4000, untouched)
#      |
#      +---- /api/*    ----> existing backend       (127.0.0.1:4000, untouched)
#      |
#      +---- /admin/*  ----> admin:3001 via 127.0.0.1:3001 (this stack)
#
# This stack (all internal except admin loopback):
#   backend:5000  ----> mongodb:27017 (both internal, NO host ports)
#   frontend:3000 (internal; local/staging preview only, NOT bound in prod)
#   admin:3001    (loopback-only 127.0.0.1:3001 for host NGINX; NEVER 0.0.0.0)
#   proxy:80      (internal only; NO host port binding — host NGINX owns :80.
#                  For environments WITHOUT host NGINX, enable explicitly:
#                  docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d)
#
# Internal:
#   backend:5000
#      |
#      v
#   mongodb:27017
#
# MongoDB is INTERNAL ONLY.
# It is NOT exposed to the host/internet.

services:

  mongodb:
    image: mongo:7
    restart: unless-stopped

    # Optional auth, configured entirely through environment.
    # When MONGO_ROOT_USERNAME + MONGO_ROOT_PASSWORD are set, the
    # image creates that root user on FIRST volume init and then
    # enforces authentication. When unset (default), MongoDB runs
    # without auth and relies on network isolation (no published
    # ports — reachable only from other compose services).
    # NOTE: these only take effect on first init of an EMPTY volume.
    # Enabling auth on an existing data volume requires creating the
    # user manually — see Server/docs/DATABASE.md.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-systemaops}

    volumes:
      - mongodb_data:/data/db
      # DB bootstrap (TTL indexes + validators). Runs once, on first
      # init of an empty volume. Idempotent for later starts.
      - ./Server/mongo-init:/docker-entrypoint-initdb.d:ro

    expose:
      - "27017"

    # IMPORTANT:
    # Do NOT add:
    # ports:
    #   - "27017:27017"
    #
    # This keeps MongoDB inaccessible from outside Docker.

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  backend:
    build:
      context: ./Server

    # Internal only: reachable via the reverse proxy (/api/*). NEVER
    # published to the host in production — the public entrypoint is
    # the proxy on :80 (HTTPS terminates upstream). Host-side dev can
    # opt in via docker-compose.override.yml.
    expose:
      - "5000"

    environment:
      # Pinned on purpose (NOT ${MONGO_URI:-...}): compose interpolates
      # from the invoking shell, so any MONGO_URI exported on the host
      # (e.g. host-side dev in Server/) would silently repoint the
      # container database. The backend MUST always use Docker DNS here.
      # NEVER point this at Atlas / Supabase / Neon / any external DB.
      # Auth-enabled deployments: use a dedicated override file.
      MONGO_URI: mongodb://mongodb:27017/systemaops
      PORT: "5000"
      TRUST_PROXY: "1"
      # Persistent location for uploaded admin avatars (validated images).
      DATA_DIR: /app/data

    volumes:
      - admin_uploads:/app/data

    env_file:
      - .env

    depends_on:
      mongodb:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:5000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s


  frontend:
    build:
      context: ./systemaops-webpage

    expose:
      - "3000"

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s


  # Internal admin operations console (React SPA, static via `serve`).
  # Served at /admin/ through the HOST NGINX (systemaops.com/admin/ -> 127.0.0.1:3001).
  # Loopback-only publish so host NGINX can reach it; NEVER 0.0.0.0:3001
  # (no SERVER_IP:3001 public exposure). No link to it exists on the public site.
  admin:
    build:
      context: ./systemaops-admin

    # Host NGINX needs direct access: publish ONLY on loopback.
    ports:
      - "127.0.0.1:3001:3001"

    expose:
      - "3001"

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3001/admin/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s


  # Bundled reverse proxy for environments WITHOUT host NGINX
  # (local full-stack preview / staging without edge proxy).
  # Production with host NGINX: runs internal-only (no host :80 binding,
  # so it can never conflict with host NGINX owning port 80).
  # To bind host :80 explicitly: add -f docker-compose.proxy.yml.
  proxy:
    build:
      context: ./proxy

    expose:
      - "80"

    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      admin:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1/"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s


volumes:
  mongodb_data:
  admin_uploads: