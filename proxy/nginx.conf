# Single public entrypoint for the SystemaOps stack.
#
#   Browser -> proxy:80 -+-> /api/* -> backend:5000
#                      +-> /*      -> frontend:3000 (SPA)
#
# /api/* keeps its path when proxied (/api/contact stays /api/contact).

upstream backend_api {
  server backend:5000;
}

upstream frontend_app {
  server frontend:3000;
}

server {
  listen 80;
  server_name _;

  # API traffic -> backend. Path is preserved.
  location /api/ {
    proxy_pass http://backend_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Everything else -> frontend SPA.
  location / {
    proxy_pass http://frontend_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
