# Single public entrypoint for the SystemaOps stack.
#
#   Browser -> proxy:80 -+-> /api/*   -> backend:5000
#                        +-> /admin/* -> admin:3001 (internal console)
#                        +-> /*       -> frontend:3000 (SPA)
#
# /api/* and /admin/* keep their paths when proxied.
#
# Exception:
# /api/health -> backend /health
# because the backend health endpoint is /health.

upstream backend_api {
  server backend:5000;
}

upstream frontend_app {
  server frontend:3000;
}

upstream admin_app {
  server admin:3001;
}

# Access log WITHOUT query strings: password-reset tokens ride in
# query strings on /admin/reset-password and must never be written
# to logs. $uri carries the path only (no arguments). Declared at
# http level (this file is included inside the http block).
log_format safe_main '$remote_addr - $remote_user [$time_local] "$request_method $uri HTTP/$server_protocol" '
                     '$status $body_bytes_sent "$http_user_agent"';

server {
  listen 80;
  server_name _;

  access_log /var/log/nginx/access.log safe_main;

  # --------------------------------------------------
  # Backend health check
  # Public: /api/health
  # Backend: /health
  # --------------------------------------------------
  location = /api/health {
    proxy_pass http://backend_api/health;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 30s;
  }

  # --------------------------------------------------
  # API traffic -> backend
  # Path is preserved.
  #
  # Example:
  # /api/contact -> backend /api/contact
  # /api/careers -> backend /api/careers
  # --------------------------------------------------
  location /api/ {
    proxy_pass http://backend_api;
    proxy_http_version 1.1;

    # Allow avatar multipart uploads through; the BACKEND enforces the
    # real 5 MB limit with a clean AVATAR_TOO_LARGE error.
    client_max_body_size 8m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 30s;
  }

  # --------------------------------------------------
  # Admin console -> admin SPA.
  # The admin image publishes the Vite build at BOTH / and /admin/,
  # so the path is passed through UNCHANGED (no prefix strip):
  #   /admin/            ->  admin:3001/admin/            (index.html)
  #   /admin/login       ->  admin:3001/admin/login       (serve -s SPA -> index.html)
  #   /admin/assets/x.js ->  admin:3001/admin/assets/x.js (application/javascript)
  #
  # Do NOT strip the prefix here: the container 301s "/" to "/admin/",
  # so stripping would make /admin/ loop (strip -> "/" -> 301 -> /admin/).
  # Placed BEFORE `location /` so the frontend SPA never swallows it.
  # The app itself is authentication-gated; this routing is not security.
  # --------------------------------------------------
  location = /admin {
    return 301 /admin/;
  }

  location /admin/ {
    proxy_pass http://admin_app;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 30s;
  }

  # --------------------------------------------------
  # Everything else -> frontend SPA
  # --------------------------------------------------
  location / {
    proxy_pass http://frontend_app;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}