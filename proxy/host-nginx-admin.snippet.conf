# SystemaOps — host NGINX snippet: expose Admin at /admin/* via 127.0.0.1:3001
#
# FOR THE SERVER ADMINISTRATOR — apply manually on the production host.
# This repo NEVER edits host NGINX itself; merge the locations below into the
# EXISTING server block(s) for systemaops.com and www.systemaops.com.
#
# PRESERVE these existing locations untouched (public site already working):
#   location /     { proxy_pass http://127.0.0.1:4000; ... }  # existing website
#   location /api/ { proxy_pass http://127.0.0.1:4000; ... }  # existing backend
#
# ADD the following two locations BEFORE `location /` so /admin/* is never
# swallowed by the frontend. The Admin container (this repo, service `admin`)
# listens on 127.0.0.1:3001 (loopback only, never 0.0.0.0) and serves the Vite
# build (base /admin/) at its web root — hence the prefix strip, mirroring
# proxy/nginx.conf:
#
#   /admin/assets/app.js  ->  127.0.0.1:3001/assets/app.js
#   /admin/login          ->  127.0.0.1:3001/login  (serve -s SPA -> index.html)
#   /admin/               ->  127.0.0.1:3001/       (index.html)
#
# Admin API calls (/api/admin/*) keep going through the EXISTING /api/*
# location to the backend — do NOT add a separate /api/admin/* location.
#
# --- paste into the existing 443 (and 80, if plain-HTTP redirect block) server --- 
#
#   location = /admin {
#     return 301 /admin/;
#   }
#
#   location /admin/ {
#     rewrite ^/admin/(.*)$ /$1 break;
#     proxy_pass http://127.0.0.1:3001;
#     proxy_http_version 1.1;
#
#     proxy_set_header Host $host;
#     proxy_set_header X-Real-IP $remote_addr;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto $scheme;
#
#     proxy_read_timeout 30s;
#   }
#
# --- apply ---
#   sudo nginx -t && sudo systemctl reload nginx
#   curl -Ik https://www.systemaops.com/admin/   # expect 200 via host NGINX
#   curl -s https://www.systemaops.com/api/health # existing backend, still 200
#
# --- required backend env for HTTPS cookie auth (root .env, then recreate backend) ---
#   COOKIE_SECURE=1
#   ADMIN_APP_ORIGIN=https://www.systemaops.com
# Admin auth stays HTTP-only cookie (sysops_admin) + server-side RBAC; hiding the
# URL is NOT the security boundary.
